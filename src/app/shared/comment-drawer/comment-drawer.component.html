<div class="drawer-backdrop" *ngIf="isOpen" (click)="closeDrawer.emit()"></div>

<aside class="drawer-panel" [class.open]="isOpen">
  <div class="drawer-header">
    <div class="title-row">
      <h2>Discussion ({{ comments().length }})</h2>
      <button class="close-icon" (click)="closeDrawer.emit()" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="comment-input-card">
    <div class="author-avatar">
      <img src="https://i.pravatar.cc/100?img=33" alt="You" />
    </div>
    <div class="input-area">
      <textarea
        rows="3"
        placeholder="What are your thoughts?"
        [(ngModel)]="newCommentText">
      </textarea>
      <div class="action-bar">
        <button class="post-btn" (click)="postComment()" [disabled]="!newCommentText.trim()">
          Respond
        </button>
      </div>
    </div>
  </div>

  <div class="sort-selector">
    <span class="label">Sort:</span>
    <button [class.active]="sortOrder() === 'newest'" (click)="setSortOrder('newest')">Newest</button>
    <button [class.active]="sortOrder() === 'oldest'" (click)="setSortOrder('oldest')">Oldest</button>
  </div>

  <div class="comments-scroll">
    <div *ngIf="comments().length === 0" class="empty-state">
      No comments yet. Start the conversation!
    </div>

    <div *ngFor="let comment of comments()" class="comment-block">
      <div class="user-meta">
        <img [src]="comment.user.profile_image_90 || 'https://i.pravatar.cc/80'" alt="Avatar" />
        <div class="user-details">
          <span class="name">{{ comment.user.name }}</span>
          <span class="date">{{ comment.created_at | date:'shortTime' }}</span>
        </div>
      </div>

      <div class="comment-body" [innerHTML]="comment.body_html"></div>

      <div class="comment-actions">
        <button
          class="action-btn"
          [style.color]="isCommentLiked(comment.id_code) ? '#ef4444' : '#64748b'"
          (click)="toggleLike(comment)">
          <svg width="14" height="14" viewBox="0 0 24 24" [attr.fill]="isCommentLiked(comment.id_code) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-right: 4px;">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          {{ comment.likes || 0 }}
        </button>
        <button class="action-btn" (click)="replyingToId.set(replyingToId() === comment.id_code ? null : comment.id_code)">
          Reply
        </button>
      </div>

      <div class="reply-input-wrapper" *ngIf="replyingToId() === comment.id_code">
        <input
          type="text"
          placeholder="Write a reply..."
          [(ngModel)]="replyTextMap[comment.id_code]"
          (keyup.enter)="postReply(comment)"
        />
        <button class="send-reply-btn" (click)="postReply(comment)">Post</button>
      </div>

      <div class="nested-replies" *ngIf="comment.children?.length">
        <div *ngFor="let reply of comment.children" class="nested-item">
          <div class="user-meta">
            <img [src]="reply.user.profile_image_90 || 'https://i.pravatar.cc/60'" alt="Avatar" />
            <div class="user-details">
              <span class="name">{{ reply.user.name }}</span>
              <span class="date">{{ reply.created_at | date:'shortTime' }}</span>
            </div>
          </div>
          <div class="comment-body" [innerHTML]="reply.body_html"></div>
        </div>
      </div>
    </div>
  </div>
</aside>
