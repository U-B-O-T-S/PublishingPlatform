<div class="editor-page-wrapper">
  <header class="editor-header">
    <div class="left-group">
      <a class="back-circle-btn" routerLink="/" (click)="saveDraft()" title="Back to Feed">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </a>
      <div class="save-status-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
        </svg>
        <span>{{ saveStatus() }}</span>
      </div>
    </div>

    <div class="right-group">
      <button class="btn btn-secondary" (click)="showScheduleModal.set(true)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
          <line x1="16" x2="16" y1="2" y2="6"/>
          <line x1="8" x2="8" y1="2" y2="6"/>
          <line x1="3" x2="21" y1="10" y2="10"/>
        </svg>
        <span>Schedule</span>
      </button>
      <button class="btn btn-primary" (click)="publishArticle()">
        Publish
      </button>
    </div>
  </header>

  <main class="editor-canvas">
    <div class="cover-uploader" (click)="onThumbnailPrompt()">
      <div *ngIf="!coverImage()" class="placeholder-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
          <circle cx="9" cy="9" r="2"/>
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
        </svg>
        <span>Add thumbnail / cover image</span>
      </div>
      <img *ngIf="coverImage()" [src]="coverImage()" alt="Thumbnail preview" class="preview-img" />
    </div>

    <input
      type="text"
      class="title-input"
      placeholder="Article Title..."
      [ngModel]="title()"
      (ngModelChange)="title.set($event); onContentChange()"
    />

    <div class="category-select">
      <label>Category:</label>
      <select [ngModel]="selectedCategory()" (ngModelChange)="selectedCategory.set($event); onContentChange()">
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <textarea
      class="content-editor"
      placeholder="Tell your story... Format text, embed links, and share your ideas."
      [ngModel]="contentHtml()"
      (ngModelChange)="contentHtml.set($event); onContentChange()">
    </textarea>
  </main>
</div>
